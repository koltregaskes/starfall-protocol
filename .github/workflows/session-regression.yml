name: Playable session

on: [push, pull_request]

permissions:
  contents: read

jobs:
  mission:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node tests/playable-session.mjs
